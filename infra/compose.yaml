name: retinaecho

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retinaecho}
      POSTGRES_USER: ${POSTGRES_USER:-retinaecho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retinaecho_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - retinaecho-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - retinaecho-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  retinaecho-postgres:
  retinaecho-redis:

