<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="description" content="数字记忆相框 - 患者端">
<title>数字记忆相框</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/patient.css">
</head>
<body>

<div id="app" data-state="COLD_START">

  <div class="frame-container">
    <div class="frame-corner frame-corner--tl"></div>
    <div class="frame-corner frame-corner--tr"></div>
    <div class="frame-corner frame-corner--bl"></div>
    <div class="frame-corner frame-corner--br"></div>

    <div class="frame-inner">

      <!-- COLD_START -->
      <div class="state-section state-COLD_START">
        <div class="coldstart-title">数字记忆相框</div>
        <div class="coldstart-subtitle">请家属使用手机扫描二维码完成绑定</div>
        <div id="qr-code"></div>
        <div id="device-code">------</div>
        <div class="coldstart-hint">等待家属端扫码绑定...</div>
      </div>

      <!-- STANDBY -->
      <div class="state-section state-STANDBY">
        <div id="photo-carousel"></div>
      </div>

      <!-- CHAT -->
      <div class="state-section state-CHAT">
        <div id="chat-avatar"></div>
        <div id="chat-persona-name">老街坊</div>
        <div id="chat-subtitle">你好，今天想聊什么？</div>
        <div id="chat-wave"></div>
      </div>

      <!-- SOOTHING -->
      <div class="state-section state-SOOTHING">
        <div id="soothing-overlay"></div>
        <div id="white-noise-tag">♫ 白噪音</div>
        <div style="position:absolute;bottom:100px;left:50%;transform:translateX(-50%);color:rgba(220,180,140,.6);font-size:clamp(1rem,2vw,1.6rem);letter-spacing:2px;z-index:3;text-align:center;">天快黑了<br>我陪您歇会儿</div>
      </div>

    </div>
  </div>
</div>

<script src="js/mock-api.js"></script>
<script src="js/state-machine.js"></script>
<script src="js/photo-carousel.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
